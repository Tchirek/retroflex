[package]
name = "retroflex-app"
version = "0.4.6"
description = "Listen together, without a center."
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Tchirek/retroflex"

[lib]
name = "retroflex_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2"
tauri-plugin-haptics = "2"
tauri-plugin-opener = "2"
ureq = "3.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
